name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test, security smoke test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install qpdf
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run regression tests
        run: npm test

      - name: Run security smoke test
        run: npm run test:security

      - name: Run compression benchmark
        run: npm run benchmark:compression

      - name: Upload compression benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compression-benchmark-${{ github.run_id }}
          path: benchmark-results/compression.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build application
        run: npm run build
